name: Update Weather Data

permissions:
  contents: write

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'

jobs:
  update-weather:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get SwitchBot sensor data
        env:
          SWITCHBOT_TOKEN: ${{ secrets.SWITCHBOT_TOKEN }}
          SWITCHBOT_SECRET: ${{ secrets.SWITCHBOT_SECRET }}
          DEVICE_ID: E77601C60C32

        run: |
          python3 <<'PY'
          import os
          import time
          import uuid
          import hmac
          import hashlib
          import base64
          import urllib.request
          import json

          from datetime import datetime, timezone, timedelta
          from zoneinfo import ZoneInfo

          token = os.environ["SWITCHBOT_TOKEN"]
          secret = os.environ["SWITCHBOT_SECRET"]
          device_id = os.environ["DEVICE_ID"]

          # ------------------------------------------------
          # SWITCHBOT API
          # ------------------------------------------------

          t = str(int(time.time() * 1000))
          nonce = str(uuid.uuid4())

          data = token + t + nonce

          sign = base64.b64encode(
              hmac.new(
                  secret.encode("utf-8"),
                  data.encode("utf-8"),
                  hashlib.sha256
              ).digest()
          ).decode("utf-8")

          url = f"https://api.switch-bot.com/v1.1/devices/{device_id}/status"

          req = urllib.request.Request(
              url,
              headers={
                  "Authorization": token,
                  "sign": sign,
                  "nonce": nonce,
                  "t": t,
                  "Content-Type": "application/json"
              }
          )

          with urllib.request.urlopen(req) as response:
              result = json.loads(response.read().decode())

          body = result.get("body", {})

          temperature = body.get("temperature")
          humidity = body.get("humidity")
          battery = body.get("battery")

          if temperature is None or humidity is None:
              raise RuntimeError("Temperatura o umidità non disponibili")

          temperature = float(temperature)
          humidity = int(humidity)

          now_utc = datetime.now(timezone.utc)
          now_italy = now_utc.astimezone(ZoneInfo("Europe/Rome"))

          timestamp = now_utc.isoformat()
          local_date = now_italy.strftime("%Y-%m-%d")
          local_time = now_italy.strftime("%H:%M")

          # ------------------------------------------------
          # DATO ATTUALE
          # ------------------------------------------------

          current_data = {
              "deviceId": device_id,
              "temperature": temperature,
              "humidity": humidity,
              "battery": battery,
              "updatedAt": timestamp
          }

          with open("weather-data.json", "w", encoding="utf-8") as f:
              json.dump(
                  current_data,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          # ------------------------------------------------
          # STORICO ULTIMI 7 GIORNI
          # ------------------------------------------------

          history_file = "weather-history.json"

          try:
              with open(history_file, "r", encoding="utf-8") as f:
                  history = json.load(f)

              if not isinstance(history, list):
                  history = []

          except (FileNotFoundError, json.JSONDecodeError):
              history = []

          history.append({
              "time": timestamp,
              "temperature": temperature,
              "humidity": humidity
          })

          cutoff = now_utc - timedelta(days=7)

          clean_history = []

          for item in history:
              try:
                  item_time = datetime.fromisoformat(
                      item["time"].replace("Z", "+00:00")
                  )

                  if item_time >= cutoff:
                      clean_history.append(item)

              except Exception:
                  pass

          with open(history_file, "w", encoding="utf-8") as f:
              json.dump(
                  clean_history,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          # ------------------------------------------------
          # ARCHIVIO GIORNALIERO PERMANENTE
          # ------------------------------------------------

          daily_file = "weather-daily.json"

          try:
              with open(daily_file, "r", encoding="utf-8") as f:
                  daily = json.load(f)

              if not isinstance(daily, list):
                  daily = []

          except (FileNotFoundError, json.JSONDecodeError):
              daily = []

          today = None

          for item in daily:
              if item.get("date") == local_date:
                  today = item
                  break

          if today is None:

              today = {
                  "date": local_date,
                  "min": temperature,
                  "minTime": local_time,
                  "max": temperature,
                  "maxTime": local_time,
                  "samples": 1
              }

              daily.append(today)

          else:

              today["samples"] = int(today.get("samples", 0)) + 1

              if temperature < float(today["min"]):
                  today["min"] = temperature
                  today["minTime"] = local_time

              if temperature > float(today["max"]):
                  today["max"] = temperature
                  today["maxTime"] = local_time

          daily.sort(
              key=lambda x: x.get("date", "")
          )

          with open(daily_file, "w", encoding="utf-8") as f:
              json.dump(
                  daily,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("Dato attuale:")
          print(json.dumps(current_data, indent=2))

          print()
          print("Rilevazioni storico 7 giorni:", len(clean_history))
          print("Giorni archivio:", len(daily))

          print()
          print("Oggi:")
          print(json.dumps(today, indent=2))

          PY

      - name: Commit weather data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add weather-data.json weather-history.json weather-daily.json

          git diff --staged --quiet || git commit -m "Update SwitchBot weather data"

      - name: Push changes
        run: |
          git push
