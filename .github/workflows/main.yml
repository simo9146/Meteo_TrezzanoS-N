name: Update Weather Data

permissions:
  contents: write

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

jobs:
  update-weather:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get SwitchBot sensor data
        env:
          SWITCHBOT_TOKEN: ${{ secrets.SWITCHBOT_TOKEN }}
          SWITCHBOT_SECRET: ${{ secrets.SWITCHBOT_SECRET }}
          DEVICE_ID: E77601C60C32

        run: |
          python3 <<'PY'
          import os
          import time
          import uuid
          import hmac
          import hashlib
          import base64
          import urllib.request
          import json
          from datetime import datetime, timezone, timedelta

          token = os.environ["SWITCHBOT_TOKEN"]
          secret = os.environ["SWITCHBOT_SECRET"]
          device_id = os.environ["DEVICE_ID"]

          # --- AUTENTICAZIONE SWITCHBOT ---
          t = str(int(time.time() * 1000))
          nonce = str(uuid.uuid4())

          data = token + t + nonce

          sign = base64.b64encode(
              hmac.new(
                  secret.encode("utf-8"),
                  data.encode("utf-8"),
                  hashlib.sha256
              ).digest()
          ).decode("utf-8")

          url = f"https://api.switch-bot.com/v1.1/devices/{device_id}/status"

          req = urllib.request.Request(
              url,
              headers={
                  "Authorization": token,
                  "sign": sign,
                  "nonce": nonce,
                  "t": t,
                  "Content-Type": "application/json"
              }
          )

          with urllib.request.urlopen(req) as response:
              result = json.loads(response.read().decode())

          body = result.get("body", {})

          temperature = body.get("temperature")
          humidity = body.get("humidity")
          battery = body.get("battery")

          now = datetime.now(timezone.utc)

          timestamp = now.isoformat()

          # ------------------------------------------------
          # FILE CON IL DATO ATTUALE
          # ------------------------------------------------

          current_data = {
              "deviceId": device_id,
              "temperature": temperature,
              "humidity": humidity,
              "battery": battery,
              "updatedAt": timestamp
          }

          with open("weather-data.json", "w", encoding="utf-8") as f:
              json.dump(
                  current_data,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          # ------------------------------------------------
          # STORICO
          # ------------------------------------------------

          history_file = "weather-history.json"

          try:
              with open(history_file, "r", encoding="utf-8") as f:
                  history = json.load(f)

              if not isinstance(history, list):
                  history = []

          except (FileNotFoundError, json.JSONDecodeError):
              history = []

          history.append({
              "time": timestamp,
              "temperature": temperature,
              "humidity": humidity
          })

          # Conserviamo gli ultimi 7 giorni
          cutoff = now - timedelta(days=7)

          clean_history = []

          for item in history:
              try:
                  item_time = datetime.fromisoformat(
                      item["time"].replace("Z", "+00:00")
                  )

                  if item_time >= cutoff:
                      clean_history.append(item)

              except Exception:
                  pass

          with open(history_file, "w", encoding="utf-8") as f:
              json.dump(
                  clean_history,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("DATO ATTUALE")
          print(json.dumps(current_data, indent=2))

          print()
          print("Numero rilevazioni nello storico:", len(clean_history))

          PY

      - name: Commit weather data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add weather-data.json weather-history.json

          git diff --staged --quiet || git commit -m "Update SwitchBot weather data"

      - name: Push changes
        run: |
          git push
