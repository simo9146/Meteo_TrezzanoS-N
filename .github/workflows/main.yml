name: Update SwitchBot weather data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: switchbot-weather-update
  cancel-in-progress: false

jobs:
  update-weather:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    env:
      SWITCHBOT_TOKEN: ${{ secrets.SWITCHBOT_TOKEN }}
      SWITCHBOT_SECRET: ${{ secrets.SWITCHBOT_SECRET }}
      DEVICE_ID: E77601C60C32

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aggiorna Home e raccogli i campioni per l'Archivio
        shell: bash
        run: |
          python - <<'PY'
          import os
          import json
          import time
          import uuid
          import hmac
          import hashlib
          import base64
          import urllib.request
          import subprocess
          from pathlib import Path
          from datetime import datetime, timedelta, timezone
          from zoneinfo import ZoneInfo

          TOKEN = os.environ["SWITCHBOT_TOKEN"]
          SECRET = os.environ["SWITCHBOT_SECRET"]
          DEVICE_ID = os.environ["DEVICE_ID"]

          ROME = ZoneInfo("Europe/Rome")

          API_URL = (
              f"https://api.switch-bot.com/v1.1/"
              f"devices/{DEVICE_ID}/status"
          )

          NORMALIZATION_START_DATE = "2026-09-11"

          # Correzione umidità: +3 punti percentuali
          UR_CORRECTION = 3.0

          # ============================================================
          # RIPARAZIONE UNA TANTUM DEL DATO ERRATO DEL 19/09/2026
          # ============================================================

          REPAIR_DATE = "2026-09-19"
          REPAIR_BAD_TEMPERATURE_MAX = 10.0

          def read_json(path, default):
              p = Path(path)
              if not p.exists():
                  return default

              try:
                  return json.loads(
                      p.read_text(encoding="utf-8")
                  )
              except Exception:
                  return default

          def write_json(path, data):
              Path(path).write_text(
                  json.dumps(
                      data,
                      ensure_ascii=False,
                      indent=2
                  ) + "\n",
                  encoding="utf-8"
              )

          def run_git(*args):
              subprocess.run(
                  ["git", *args],
                  check=True
              )

          def parse_iso(value):
              try:
                  return datetime.fromisoformat(
                      str(value).replace("Z", "+00:00")
                  )
              except Exception:
                  return None

          def commit_and_push(files, message):
              run_git(
                  "config",
                  "user.name",
                  "github-actions[bot]"
              )

              run_git(
                  "config",
                  "user.email",
                  "41898282+github-actions[bot]@users.noreply.github.com"
              )

              run_git("add", *files)

              changed = (
                  subprocess.run(
                      ["git", "diff", "--cached", "--quiet"]
                  ).returncode != 0
              )

              if not changed:
                  print(
                      "Nessuna modifica da salvare:",
                      message
                  )
                  return

              run_git("commit", "-m", message)

              run_git(
                  "pull",
                  "--rebase",
                  "origin",
                  "main"
              )

              run_git(
                  "push",
                  "origin",
                  "main"
              )

          # ============================================================
          # NORMALIZZAZIONE
          # ============================================================

          def normalize_temperature(temperature, humidity):
              """
              NON modifica la temperatura.

              Applica esclusivamente +3 punti percentuali
              all'umidità, con limite massimo 100%.
              """

              if humidity is None:
                  return temperature, humidity

              corrected_humidity = min(
                  humidity + UR_CORRECTION,
                  100.0
              )

              return temperature, corrected_humidity

          # ============================================================
          # SWITCHBOT
          # ============================================================

          def switchbot_status():

              nonce = str(uuid.uuid4())

              t = str(
                  int(time.time() * 1000)
              )

              message = (
                  TOKEN +
                  t +
                  nonce
              )

              sign = base64.b64encode(
                  hmac.new(
                      SECRET.encode("utf-8"),
                      message.encode("utf-8"),
                      hashlib.sha256
                  ).digest()
              ).decode("utf-8")

              req = urllib.request.Request(
                  API_URL,
                  headers={
                      "Authorization": TOKEN,
                      "sign": sign,
                      "nonce": nonce,
                      "t": t,
                      "Content-Type":
                          "application/json; charset=utf8"
                  }
              )

              with urllib.request.urlopen(
                  req,
                  timeout=30
              ) as response:

                  payload = json.load(response)

              if payload.get("statusCode") != 100:
                  raise RuntimeError(
                      "SwitchBot API error: "
                      f"{payload.get('message')}"
                  )

              body = payload.get("body") or {}

              return {
                  "temperature":
                      float(body["temperature"]),

                  "humidity":
                      float(body["humidity"]),

                  "battery":
                      body.get("battery"),

                  "capturedAt":
                      datetime.now(timezone.utc)
              }

          # ============================================================
          # PRIMA LETTURA
          # ============================================================

          samples = []

          first = switchbot_status()

          samples.append(first)

          first_local = (
              first["capturedAt"]
              .astimezone(ROME)
          )

          first_date = first_local.strftime(
              "%Y-%m-%d"
          )

          first_time = first_local.strftime(
              "%H:%M"
          )

          raw_temp = first["temperature"]
          raw_humidity = first["humidity"]

          # Normalizzazione:
          # temperatura invariata
          # umidità +3%
          if first_date >= NORMALIZATION_START_DATE:

              home_temp, home_humidity = (
                  normalize_temperature(
                      raw_temp,
                      raw_humidity
                  )
              )

          else:

              home_temp = raw_temp
              home_humidity = raw_humidity

          home_temp = round(
              home_temp,
              2
          )

          home_humidity = round(
              home_humidity,
              1
          )

          print(
              "HOME - "
              f"{home_temp:.2f} °C / "
              f"{home_humidity:.1f}% - "
              f"{first['capturedAt'].isoformat()}"
          )

          # ============================================================
          # HISTORY
          # ============================================================

          history = read_json(
              "weather-history.json",
              []
          )

          if not isinstance(history, list):
              history = []

          history.append({
              "time":
                  first["capturedAt"]
                  .isoformat()
                  .replace("+00:00", "Z"),

              "temperature":
                  home_temp,

              "humidity":
                  home_humidity
          })

          # ============================================================
          # RIPARAZIONE DEL VALORE 7,2 °C
          #
          # Rimuove dalla giornata 19/09/2026 eventuali valori
          # chiaramente anomali inferiori o uguali a 10 °C.
          # È una correzione una tantum per il dato errato.
          # ============================================================

          repaired_history = []

          for row in history:

              if not isinstance(row, dict):
                  continue

              row_time = parse_iso(
                  row.get("time")
              )

              if row_time is None:
                  continue

              row_local = row_time.astimezone(
                  ROME
              )

              row_date = row_local.strftime(
                  "%Y-%m-%d"
              )

              row_temp = row.get(
                  "temperature"
              )

              if (
                  row_date == REPAIR_DATE
                  and isinstance(
                      row_temp,
                      (int, float)
                  )
                  and row_temp <=
                      REPAIR_BAD_TEMPERATURE_MAX
              ):

                  print(
                      "RIPARAZIONE: rimosso "
                      f"dato anomalo {row_temp} °C "
                      f"del {row_date} "
                      f"alle {row_local.strftime('%H:%M')}"
                  )

                  continue

              repaired_history.append(row)

          history = repaired_history

          # Mantieni solo gli ultimi 7 giorni

          cutoff = (
              datetime.now(timezone.utc)
              - timedelta(days=7)
          )

          clean_history = []

          for row in history:

              dt = parse_iso(
                  row.get("time")
              )

              if (
                  dt is not None
                  and dt >= cutoff
              ):
                  clean_history.append(row)

          clean_history.sort(
              key=lambda x: x.get(
                  "time",
                  ""
              )
          )

          write_json(
              "weather-history.json",
              clean_history
          )

          # ============================================================
          # DAILY HOME
          #
          # Il giorno corrente viene ricalcolato dalla history pulita.
          # Questo elimina automaticamente la minima errata di 7,2 °C.
          # ============================================================

          daily = read_json(
              "weather-daily.json",
              []
          )

          if not isinstance(daily, list):
              daily = []

          today_rows = []

          for row in clean_history:

              dt = parse_iso(
                  row.get("time")
              )

              if dt is None:
                  continue

              local_dt = dt.astimezone(
                  ROME
              )

              if (
                  local_dt.strftime("%Y-%m-%d")
                  == first_date
              ):

                  temp = row.get(
                      "temperature"
                  )

                  if isinstance(
                      temp,
                      (int, float)
                  ):
                      today_rows.append(
                          (
                              float(temp),
                              local_dt
                          )
                      )

          if today_rows:

              min_temp, min_dt = min(
                  today_rows,
                  key=lambda x: x[0]
              )

              max_temp, max_dt = max(
                  today_rows,
                  key=lambda x: x[0]
              )

              new_today = {
                  "date": first_date,
                  "min": round(
                      min_temp,
                      2
                  ),
                  "minTime":
                      min_dt.strftime(
                          "%H:%M"
                      ),
                  "max": round(
                      max_temp,
                      2
                  ),
                  "maxTime":
                      max_dt.strftime(
                          "%H:%M"
                      )
              }

              daily = [
                  row
                  for row in daily
                  if not (
                      isinstance(row, dict)
                      and row.get("date")
                      == first_date
                  )
              ]

              daily.append(
                  new_today
              )

          daily.sort(
              key=lambda x: x.get(
                  "date",
                  ""
              )
          )

          write_json(
              "weather-daily.json",
              daily
          )

          # ============================================================
          # PUSH HOME
          # ============================================================

          current_data = {
              "temperature":
                  home_temp,

              "humidity":
                  home_humidity,

              "updatedAt":
                  first["capturedAt"]
                  .isoformat()
                  .replace(
                      "+00:00",
                      "Z"
                  )
          }

          if first["battery"] is not None:
              current_data["battery"] = (
                  first["battery"]
              )

          write_json(
              "weather-data.json",
              current_data
          )

          commit_and_push(
              [
                  "weather-data.json",
                  "weather-history.json",
                  "weather-daily.json"
              ],
              "Update SwitchBot weather data"
          )

          # ============================================================
          # ARCHIVIO
          #
          # 5 rilevazioni:
          # 1 subito
          # + 4 ogni 2 minuti
          # ============================================================

          for i in range(4):

              time.sleep(120)

              reading = switchbot_status()

              samples.append(
                  reading
              )

              print(
                  f"ARCHIVIO - campione "
                  f"{i + 2}/5: "
                  f"{reading['temperature']:.1f} °C - "
                  f"{reading['humidity']:.0f}% - "
                  f"{reading['capturedAt'].isoformat()}"
              )

          # ============================================================
          # MEDIA DEI 5 CAMPIONI
          # ============================================================

          avg_temp = round(
              sum(
                  x["temperature"]
                  for x in samples
              ) / len(samples),
              2
          )

          avg_humidity = round(
              sum(
                  x["humidity"]
                  for x in samples
              ) / len(samples),
              1
          )

          first_local = (
              samples[0]["capturedAt"]
              .astimezone(ROME)
          )

          block_start = first_local.replace(
              minute=(
                  first_local.minute // 10
              ) * 10,
              second=0,
              microsecond=0
          )

          block_end = (
              block_start
              + timedelta(minutes=10)
          )

          archive_date = (
              block_start.strftime(
                  "%Y-%m-%d"
              )
          )

          archive_time = (
              block_end.strftime(
                  "%H:%M"
              )
          )

          slot = {
              "time":
                  block_end
                  .astimezone(timezone.utc)
                  .isoformat()
                  .replace(
                      "+00:00",
                      "Z"
                  ),

              "date":
                  archive_date,

              "localTime":
                  archive_time,

              "temperature":
                  avg_temp,

              "humidity":
                  avg_humidity,

              "samples":
                  len(samples),

              "method":
                  "mean_5_samples_2min"
          }

          # ============================================================
          # ARCHIVE 10 MIN
          # ============================================================

          tenmin = read_json(
              "weather-archive-10min.json",
              []
          )

          if not isinstance(
              tenmin,
              list
          ):
              tenmin = []

          tenmin = [
              row
              for row in tenmin
              if not (
                  isinstance(row, dict)
                  and row.get("time")
                  == slot["time"]
              )
          ]

          tenmin.append(slot)

          tenmin.sort(
              key=lambda x: x.get(
                  "time",
                  ""
              )
          )

          write_json(
              "weather-archive-10min.json",
              tenmin
          )

          # ============================================================
          # ARCHIVE DAILY
          # ============================================================

          archive_daily = read_json(
              "weather-archive-daily.json",
              []
          )

          if not isinstance(
              archive_daily,
              list
          ):
              archive_daily = []

          normalized_archive_temp = (
              avg_temp
          )

          normalized_archive_humidity = (
              avg_humidity
          )

          if (
              archive_date
              >= NORMALIZATION_START_DATE
          ):

              (
                  normalized_archive_temp,
                  normalized_archive_humidity
              ) = normalize_temperature(
                  avg_temp,
                  avg_humidity
              )

              normalized_archive_temp = round(
                  normalized_archive_temp,
                  2
              )

              normalized_archive_humidity = round(
                  normalized_archive_humidity,
                  1
              )

          day = next(
              (
                  row
                  for row in archive_daily
                  if (
                      isinstance(row, dict)
                      and row.get("date")
                      == archive_date
                  )
              ),
              None
          )

          if day is None:

              day = {
                  "date":
                      archive_date,

                  "min":
                      normalized_archive_temp,

                  "minTime":
                      archive_time,

                  "max":
                      normalized_archive_temp,

                  "maxTime":
                      archive_time,

                  "method":
                      "10min_mean_of_5_samples_every_2min_normalized_UR_plus_3"
              }

              archive_daily.append(day)

          else:

              if (
                  normalized_archive_temp
                  < float(
                      day.get(
                          "min",
                          normalized_archive_temp
                      )
                  )
              ):

                  day["min"] = (
                      normalized_archive_temp
                  )

                  day["minTime"] = (
                      archive_time
                  )

              if (
                  normalized_archive_temp
                  > float(
                      day.get(
                          "max",
                          normalized_archive_temp
                      )
                  )
              ):

                  day["max"] = (
                      normalized_archive_temp
                  )

                  day["maxTime"] = (
                      archive_time
                  )

              day["method"] = (
                  "10min_mean_of_5_samples_every_2min_normalized_UR_plus_3"
              )

          archive_daily.sort(
              key=lambda x: x.get(
                  "date",
                  ""
              )
          )

          write_json(
              "weather-archive-daily.json",
              archive_daily
          )

          print(
              "ARCHIVIO - slot "
              f"{block_start.strftime('%H:%M')}-"
              f"{block_end.strftime('%H:%M')} => "
              f"{avg_temp:.2f} °C "
              f"({len(samples)} campioni)"
          )

          # ============================================================
          # PUSH ARCHIVIO
          # ============================================================

          commit_and_push(
              [
                  "weather-archive-10min.json",
                  "weather-archive-daily.json"
              ],
              "Aggiorna archivio preciso - medie 10 minuti"
          )

          PY
