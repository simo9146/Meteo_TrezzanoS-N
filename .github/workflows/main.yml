name: Update SwitchBot weather data

on:
  workflow_dispatch:

  schedule:
    - cron: "*/10 * * * *"

concurrency:
  # Stesso gruppo utilizzato dal workflow MET Norway.
  # I due workflow non possono scrivere contemporaneamente sul main.
  group: meteo-trezzano-main-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-weather:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      SWITCHBOT_TOKEN: ${{ secrets.SWITCHBOT_TOKEN }}
      SWITCHBOT_SECRET: ${{ secrets.SWITCHBOT_SECRET }}
      DEVICE_ID: E77601C60C32

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aggiorna Home e raccogli i campioni per l'Archivio
        run: |
          python - <<'PY'
          import os
          import json
          import time
          import uuid
          import hmac
          import hashlib
          import base64
          import urllib.request
          import subprocess
          import math
          from pathlib import Path
          from datetime import datetime, timedelta, timezone
          from zoneinfo import ZoneInfo

          TOKEN = os.environ["SWITCHBOT_TOKEN"]
          SECRET = os.environ["SWITCHBOT_SECRET"]
          DEVICE_ID = os.environ["DEVICE_ID"]

          ROME = ZoneInfo("Europe/Rome")
          API_URL = f"https://api.switch-bot.com/v1.1/devices/{DEVICE_ID}/status"

          NORMALIZATION_START_DATE = "2026-09-11"
          ARCHIVE_START_DATE = "2026-09-01"
          UR_CORRECTION = 3.0

          def read_json(path, default):
              p = Path(path)

              if not p.exists():
                  return default

              try:
                  return json.loads(
                      p.read_text(encoding="utf-8")
                  )
              except Exception:
                  return default

          def write_json(path, data):
              Path(path).write_text(
                  json.dumps(
                      data,
                      ensure_ascii=False,
                      indent=2
                  ) + "\n",
                  encoding="utf-8"
              )

          def run_git(*args):
              subprocess.run(
                  ["git", *args],
                  check=True
              )

          def switchbot_status():
              nonce = str(uuid.uuid4())
              t = str(int(time.time() * 1000))
              message = TOKEN + t + nonce

              sign = base64.b64encode(
                  hmac.new(
                      SECRET.encode("utf-8"),
                      message.encode("utf-8"),
                      hashlib.sha256
                  ).digest()
              ).decode("utf-8")

              req = urllib.request.Request(
                  API_URL,
                  headers={
                      "Authorization": TOKEN,
                      "sign": sign,
                      "nonce": nonce,
                      "t": t,
                      "Content-Type": "application/json; charset=utf8"
                  }
              )

              with urllib.request.urlopen(
                  req,
                  timeout=30
              ) as response:
                  payload = json.load(response)

              if payload.get("statusCode") != 100:
                  raise RuntimeError(
                      f"SwitchBot API error: {payload.get('message')}"
                  )

              body = payload.get("body") or {}

              return {
                  "temperature": float(body["temperature"]),
                  "humidity": float(body["humidity"]),
                  "battery": body.get("battery"),
                  "capturedAt": datetime.now(timezone.utc)
              }

          def parse_iso(value):
              try:
                  return datetime.fromisoformat(
                      str(value).replace("Z", "+00:00")
                  )
              except Exception:
                  return None

          def normalize_temperature(
              temperature,
              humidity
          ):
              T1 = float(temperature)
              UR1 = float(humidity)

              if UR1 <= 0:
                  return (
                      T1,
                      max(
                          0.0,
                          min(100.0, UR1)
                      )
                  )

              UR2 = min(
                  UR1 + UR_CORRECTION,
                  100.0
              )

              E = (
                  6.1078
                  * 10 ** (
                      (7.5 * T1)
                      / (237.3 + T1)
                  )
                  * UR1
                  / 100.0
              )

              if E <= 0:
                  return T1, UR2

              Psat2 = E / UR2 * 100.0

              x = math.log10(
                  Psat2 / 6.1078
              )

              T2 = (
                  237.3 * x
                  / (7.5 - x)
              )

              return T2, UR2

          def commit_and_push(
              files,
              message
          ):
              run_git(
                  "config",
                  "user.name",
                  "github-actions[bot]"
              )

              run_git(
                  "config",
                  "user.email",
                  "41898282+github-actions[bot]@users.noreply.github.com"
              )

              backup_dir = Path(
                  "/tmp/meteo-generated"
              )

              backup_dir.mkdir(
                  parents=True,
                  exist_ok=True
              )

              for file in files:
                  src = Path(file)

                  if src.exists():
                      (
                          backup_dir
                          / src.name
                      ).write_text(
                          src.read_text(
                              encoding="utf-8"
                          ),
                          encoding="utf-8"
                      )

              for attempt in range(1, 4):
                  try:
                      print(
                          f"Sincronizzazione main - "
                          f"tentativo {attempt}/3"
                      )

                      run_git(
                          "fetch",
                          "origin",
                          "main"
                      )

                      run_git(
                          "reset",
                          "--hard",
                          "origin/main"
                      )

                      for file in files:
                          backup = (
                              backup_dir
                              / Path(file).name
                          )

                          if backup.exists():
                              Path(file).write_text(
                                  backup.read_text(
                                      encoding="utf-8"
                                  ),
                                  encoding="utf-8"
                              )

                      run_git(
                          "add",
                          *files
                      )

                      changed = (
                          subprocess.run(
                              [
                                  "git",
                                  "diff",
                                  "--cached",
                                  "--quiet"
                              ]
                          ).returncode != 0
                      )

                      if not changed:
                          print(
                              "Nessuna modifica da salvare:",
                              message
                          )
                          return

                      run_git(
                          "commit",
                          "-m",
                          message
                      )

                      run_git(
                          "push",
                          "origin",
                          "HEAD:main"
                      )

                      print(
                          f"Push riuscito al tentativo "
                          f"{attempt}."
                      )

                      return

                  except subprocess.CalledProcessError:
                      print(
                          f"Push fallito al tentativo "
                          f"{attempt}/3."
                      )

                      subprocess.run(
                          [
                              "git",
                              "merge",
                              "--abort"
                          ],
                          stdout=subprocess.DEVNULL,
                          stderr=subprocess.DEVNULL
                      )

                      subprocess.run(
                          [
                              "git",
                              "rebase",
                              "--abort"
                          ],
                          stdout=subprocess.DEVNULL,
                          stderr=subprocess.DEVNULL
                      )

                      if attempt == 3:
                          raise

                      time.sleep(
                          5 * attempt
                      )

              raise RuntimeError(
                  "Impossibile salvare i dati "
                  "dopo 3 tentativi."
              )

          # ============================================================
          # HOME
          # ============================================================

          samples = []

          first = switchbot_status()
          samples.append(first)

          first_local = (
              first["capturedAt"]
              .astimezone(ROME)
          )

          home_date = first_local.strftime(
              "%Y-%m-%d"
          )

          home_time = first_local.strftime(
              "%H:%M"
          )

          raw_temp = first["temperature"]
          raw_humidity = first["humidity"]

          if home_date >= NORMALIZATION_START_DATE:
              home_temp, home_humidity = (
                  normalize_temperature(
                      raw_temp,
                      raw_humidity
                  )
              )
          else:
              home_temp = raw_temp
              home_humidity = raw_humidity

          current_data = {
              "temperature": round(
                  home_temp,
                  2
              ),
              "humidity": round(
                  home_humidity,
                  1
              ),
              "updatedAt": (
                  first["capturedAt"]
                  .isoformat()
                  .replace("+00:00", "Z")
              )
          }

          if first["battery"] is not None:
              current_data["battery"] = (
                  first["battery"]
              )

          write_json(
              "weather-data.json",
              current_data
          )

          # ============================================================
          # STORICO HOME
          # ============================================================

          history = read_json(
              "weather-history.json",
              []
          )

          if not isinstance(history, list):
              history = []

          history.append({
              "time": (
                  first["capturedAt"]
                  .isoformat()
                  .replace("+00:00", "Z")
              ),
              "temperature": round(
                  home_temp,
                  2
              ),
              "humidity": round(
                  home_humidity,
                  1
              )
          })

          cutoff = (
              datetime.now(timezone.utc)
              - timedelta(days=7)
          )

          clean_history = []

          for row in history:
              if not isinstance(row, dict):
                  continue

              dt = parse_iso(
                  row.get("time")
              )

              if (
                  dt is not None
                  and dt >= cutoff
              ):
                  clean_history.append(row)

          clean_history.sort(
              key=lambda x: x.get(
                  "time",
                  ""
              )
          )

          write_json(
              "weather-history.json",
              clean_history
          )

          # ============================================================
          # ESTREMI GIORNALIERI HOME
          # ============================================================

          daily = read_json(
              "weather-daily.json",
              []
          )

          if not isinstance(daily, list):
              daily = []

          today_row = next(
              (
                  row
                  for row in daily
                  if (
                      isinstance(row, dict)
                      and row.get("date")
                      == home_date
                  )
              ),
              None
          )

          if today_row is None:
              today_row = {
                  "date": home_date,
                  "min": round(
                      home_temp,
                      2
                  ),
                  "minTime": home_time,
                  "max": round(
                      home_temp,
                      2
                  ),
                  "maxTime": home_time
              }

              daily.append(today_row)

          else:
              if home_temp < float(
                  today_row.get(
                      "min",
                      home_temp
                  )
              ):
                  today_row["min"] = round(
                      home_temp,
                      2
                  )

                  today_row["minTime"] = (
                      home_time
                  )

              if home_temp > float(
                  today_row.get(
                      "max",
                      home_temp
                  )
              ):
                  today_row["max"] = round(
                      home_temp,
                      2
                  )

                  today_row["maxTime"] = (
                      home_time
                  )

              today_row.pop(
                  "method",
                  None
              )

          daily.sort(
              key=lambda x: x.get(
                  "date",
                  ""
              )
          )

          write_json(
              "weather-daily.json",
              daily
          )

          print(
              f"HOME - "
              f"{home_temp:.2f} °C / "
              f"{home_humidity:.1f}% - "
              f"{first['capturedAt'].isoformat()}"
          )

          # ============================================================
          # ARCHIVIO: 5 CAMPIONI OGNI 2 MINUTI
          # ============================================================

          for i in range(4):
              time.sleep(120)

              reading = switchbot_status()

              samples.append(reading)

              print(
                  f"ARCHIVIO - campione "
                  f"{i + 2}/5: "
                  f"{reading['temperature']:.2f} °C - "
                  f"{reading['humidity']:.1f}% - "
                  f"{reading['capturedAt'].isoformat()}"
              )

          # ============================================================
          # MEDIA DELLO SLOT DA 10 MINUTI
          # ============================================================

          avg_temp = round(
              sum(
                  x["temperature"]
                  for x in samples
              ) / len(samples),
              2
          )

          avg_humidity = round(
              sum(
                  x["humidity"]
                  for x in samples
              ) / len(samples),
              1
          )

          first_local = (
              samples[0]["capturedAt"]
              .astimezone(ROME)
          )

          block_start = first_local.replace(
              minute=(
                  first_local.minute // 10
              ) * 10,
              second=0,
              microsecond=0
          )

          block_end = (
              block_start
              + timedelta(minutes=10)
          )

          archive_date = (
              block_start.strftime(
                  "%Y-%m-%d"
              )
          )

          archive_time = (
              block_end.strftime(
                  "%H:%M"
              )
          )

          slot = {
              "time": (
                  block_end
                  .astimezone(timezone.utc)
                  .isoformat()
                  .replace("+00:00", "Z")
              ),
              "date": archive_date,
              "localTime": archive_time,
              "temperature": avg_temp,
              "humidity": avg_humidity,
              "samples": len(samples),
              "method": "mean_5_samples_2min"
          }

          tenmin = read_json(
              "weather-archive-10min.json",
              []
          )

          if not isinstance(tenmin, list):
              tenmin = []

          tenmin = [
              row
              for row in tenmin
              if not (
                  isinstance(row, dict)
                  and row.get("time")
                  == slot["time"]
              )
          ]

          tenmin.append(slot)

          tenmin.sort(
              key=lambda x: x.get(
                  "time",
                  ""
              )
          )

          write_json(
              "weather-archive-10min.json",
              tenmin
          )

          # ============================================================
          # ARCHIVIO GIORNALIERO
          # MIN/MAX SUGLI SLOT DA 10 MINUTI NORMALIZZATI
          # ============================================================

          today = datetime.now(
              ROME
          ).strftime("%Y-%m-%d")

          archive_daily = {}

          for row in tenmin:

              if not isinstance(row, dict):
                  continue

              date = row.get("date")

              if (
                  not date
                  or date < ARCHIVE_START_DATE
                  or date >= today
              ):
                  continue

              try:
                  raw_temperature = float(
                      row["temperature"]
                  )

                  raw_humidity = float(
                      row["humidity"]
                  )

              except Exception:
                  continue

              normalized_temp, corrected_humidity = (
                  normalize_temperature(
                      raw_temperature,
                      raw_humidity
                  )
              )

              normalized_temp = round(
                  normalized_temp,
                  2
              )

              corrected_humidity = round(
                  corrected_humidity,
                  1
              )

              local_time = row.get(
                  "localTime",
                  ""
              )

              if date not in archive_daily:

                  archive_daily[date] = {
                      "date": date,
                      "min": normalized_temp,
                      "minTime": local_time,
                      "max": normalized_temp,
                      "maxTime": local_time,
                      "method": (
                          "min_10min_max_10min_"
                          "normalized_UR_plus_3"
                      )
                  }

              else:

                  day = archive_daily[date]

                  if normalized_temp < float(
                      day["min"]
                  ):
                      day["min"] = (
                          normalized_temp
                      )

                      day["minTime"] = (
                          local_time
                      )

                  if normalized_temp > float(
                      day["max"]
                  ):
                      day["max"] = (
                          normalized_temp
                      )

                      day["maxTime"] = (
                          local_time
                      )

          archive_daily_list = sorted(
              archive_daily.values(),
              key=lambda x: x["date"]
          )

          write_json(
              "weather-archive-daily.json",
              archive_daily_list
          )

          print(
              f"ARCHIVIO - slot "
              f"{block_start.strftime('%H:%M')}-"
              f"{block_end.strftime('%H:%M')} "
              f"=> {avg_temp:.2f} °C "
              f"({len(samples)} campioni)"
          )

          # ============================================================
          # UN SOLO COMMIT/PUSH FINALE
          # ============================================================

          commit_and_push(
              [
                  "weather-data.json",
                  "weather-history.json",
                  "weather-daily.json",
                  "weather-archive-10min.json",
                  "weather-archive-daily.json"
              ],
              "Update SwitchBot weather data"
          )

          PY
