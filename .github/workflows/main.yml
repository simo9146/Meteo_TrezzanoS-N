name: Update SwitchBot weather data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-weather:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    env:
      SWITCHBOT_TOKEN: ${{ secrets.SWITCHBOT_TOKEN }}
      SWITCHBOT_SECRET: ${{ secrets.SWITCHBOT_SECRET }}
      DEVICE_ID: E77601C60C32

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aggiorna Home e raccogli i campioni per l'Archivio
        run: |
          python - <<'PY'
          import os
          import json
          import time
          import uuid
          import hmac
          import hashlib
          import base64
          import math
          import urllib.request
          import subprocess

          from pathlib import Path
          from datetime import datetime, timedelta, timezone
          from zoneinfo import ZoneInfo

          TOKEN = os.environ["SWITCHBOT_TOKEN"]
          SECRET = os.environ["SWITCHBOT_SECRET"]
          DEVICE_ID = os.environ["DEVICE_ID"]

          ROME = ZoneInfo("Europe/Rome")
          API_URL = f"https://api.switch-bot.com/v1.1/devices/{DEVICE_ID}/status"

          # ============================================================
          # PARAMETRI NORMALIZZAZIONE
          # ============================================================

          NORMALIZATION_START_DATE = "2026-09-12"
          ARCHIVE_START_DATE = "2026-09-01"
          UR_CORRECTION = 3.0

          # ============================================================
          # FUNZIONI GENERALI
          # ============================================================

          def read_json(path, default):
              p = Path(path)

              if not p.exists():
                  return default

              try:
                  return json.loads(
                      p.read_text(encoding="utf-8")
                  )
              except Exception:
                  return default


          def write_json(path, data):
              Path(path).write_text(
                  json.dumps(
                      data,
                      ensure_ascii=False,
                      indent=2
                  ) + "\n",
                  encoding="utf-8"
              )


          def run_git(*args):
              subprocess.run(
                  ["git", *args],
                  check=True
              )


          def commit_and_push(files, message):
              run_git(
                  "config",
                  "user.name",
                  "github-actions[bot]"
              )

              run_git(
                  "config",
                  "user.email",
                  "41898282+github-actions[bot]@users.noreply.github.com"
              )

              run_git("add", *files)

              changed = subprocess.run(
                  [
                      "git",
                      "diff",
                      "--cached",
                      "--quiet"
                  ]
              ).returncode != 0

              if not changed:
                  print(
                      "Nessuna modifica da salvare:",
                      message
                  )
                  return

              run_git("commit", "-m", message)

              run_git(
                  "pull",
                  "--rebase",
                  "origin",
                  "main"
              )

              run_git(
                  "push",
                  "origin",
                  "main"
              )


          def parse_iso(value):
              try:
                  return datetime.fromisoformat(
                      str(value).replace("Z", "+00:00")
                  )
              except Exception:
                  return None


          # ============================================================
          # SWITCHBOT
          # ============================================================

          def switchbot_status():

              nonce = str(uuid.uuid4())

              t = str(
                  int(time.time() * 1000)
              )

              message = TOKEN + t + nonce

              sign = base64.b64encode(
                  hmac.new(
                      SECRET.encode("utf-8"),
                      message.encode("utf-8"),
                      hashlib.sha256
                  ).digest()
              ).decode("utf-8")

              req = urllib.request.Request(
                  API_URL,
                  headers={
                      "Authorization": TOKEN,
                      "sign": sign,
                      "nonce": nonce,
                      "t": t,
                      "Content-Type":
                          "application/json; charset=utf8"
                  }
              )

              with urllib.request.urlopen(
                  req,
                  timeout=30
              ) as response:

                  payload = json.load(response)

              if payload.get("statusCode") != 100:

                  raise RuntimeError(
                      "SwitchBot API error: "
                      f"{payload.get('message')}"
                  )

              body = payload.get("body") or {}

              return {
                  "temperature":
                      float(body["temperature"]),

                  "humidity":
                      float(body["humidity"]),

                  "battery":
                      body.get("battery"),

                  "capturedAt":
                      datetime.now(timezone.utc)
              }


          # ============================================================
          # NORMALIZZAZIONE TEMPERATURA
          #
          # T1 + UR1
          #      ↓
          # E costante
          #      ↓
          # UR2 = UR1 + 3
          #      ↓
          # T2
          # ============================================================

          def normalize_temperature(
              temperature,
              humidity
          ):

              T1 = float(temperature)
              UR1 = float(humidity)

              if not math.isfinite(T1):
                  return None

              if not math.isfinite(UR1):
                  return None

              if UR1 <= 0:
                  return None

              UR2 = UR1 + UR_CORRECTION

              exponent = (
                  7.5 * T1
              ) / (
                  237.3 + T1
              )

              E = (
                  6.1078
                  * (10 ** exponent)
                  * (UR1 / 100.0)
              )

              Psat2 = (
                  E
                  / UR2
                  * 100.0
              )

              if Psat2 <= 0:
                  return None

              x = math.log10(
                  Psat2 / 6.1078
              )

              denominator = 7.5 - x

              if denominator == 0:
                  return None

              T2 = (
                  237.3 * x
              ) / denominator

              return T2


          # ============================================================
          # 1) HOME
          # ============================================================

          samples = []

          first = switchbot_status()

          samples.append(first)

          local_first = (
              first["capturedAt"]
              .astimezone(ROME)
          )

          home_date = local_first.strftime(
              "%Y-%m-%d"
          )

          home_time = local_first.strftime(
              "%H:%M"
          )

          raw_temp = first["temperature"]
          raw_humidity = first["humidity"]

          # Prima del 12/09:
          # Home mantiene i valori reali.
          #
          # Dal 12/09:
          # UR +3 e temperatura normalizzata.

          if home_date >= NORMALIZATION_START_DATE:

              home_humidity = (
                  raw_humidity
                  + UR_CORRECTION
              )

              normalized_temp = (
                  normalize_temperature(
                      raw_temp,
                      raw_humidity
                  )
              )

              if normalized_temp is not None:
                  home_temp = normalized_temp
              else:
                  home_temp = raw_temp

          else:

              home_temp = raw_temp
              home_humidity = raw_humidity


          print(
              "HOME - "
              f"reale {raw_temp:.1f} °C / "
              f"{raw_humidity:.0f}% | "
              f"mostrato {home_temp:.1f} °C / "
              f"{home_humidity:.0f}% | "
              f"{first['capturedAt'].isoformat()}"
          )


          current_data = {
              "temperature": home_temp,
              "humidity": home_humidity,
              "updatedAt":
                  first["capturedAt"]
                  .isoformat()
                  .replace("+00:00", "Z")
          }

          if first["battery"] is not None:

              current_data["battery"] = (
                  first["battery"]
              )


          write_json(
              "weather-data.json",
              current_data
          )


          # ============================================================
          # STORICO ULTIME 24 ORE / 7 GIORNI
          # ============================================================

          history = read_json(
              "weather-history.json",
              []
          )

          if not isinstance(history, list):
              history = []


          home_entry = {
              "time":
                  first["capturedAt"]
                  .isoformat()
                  .replace("+00:00", "Z"),

              "temperature":
                  home_temp,

              "humidity":
                  home_humidity
          }


          history.append(home_entry)


          cutoff = (
              datetime.now(timezone.utc)
              - timedelta(days=7)
          )

          clean_history = []

          for row in history:

              if not isinstance(row, dict):
                  continue

              dt = parse_iso(
                  row.get("time")
              )

              if (
                  dt is not None
                  and dt >= cutoff
              ):

                  clean_history.append(row)


          clean_history.sort(
              key=lambda x:
                  x.get("time", "")
          )


          write_json(
              "weather-history.json",
              clean_history
          )


          # ============================================================
          # WEATHER DAILY
          #
          # Questo file serve agli estremi mostrati oggi nella Home.
          #
          # Dal 12/09 utilizza la temperatura normalizzata.
          # ============================================================

          daily = read_json(
              "weather-daily.json",
              []
          )

          if not isinstance(daily, list):
              daily = []


          home_temp = float(home_temp)


          today = next(
              (
                  row
                  for row in daily
                  if (
                      isinstance(row, dict)
                      and row.get("date")
                      == home_date
                  )
              ),
              None
          )


          if today is None:

              today = {
                  "date": home_date,
                  "min": home_temp,
                  "minTime": home_time,
                  "max": home_temp,
                  "maxTime": home_time
              }

              daily.append(today)

          else:

              if home_temp < float(
                  today.get(
                      "min",
                      home_temp
                  )
              ):

                  today["min"] = home_temp
                  today["minTime"] = home_time


              if home_temp > float(
                  today.get(
                      "max",
                      home_temp
                  )
              ):

                  today["max"] = home_temp
                  today["maxTime"] = home_time


              today.pop(
                  "method",
                  None
              )


          daily.sort(
              key=lambda x:
                  x.get("date", "")
          )


          write_json(
              "weather-daily.json",
              daily
          )


          commit_and_push(
              [
                  "weather-data.json",
                  "weather-history.json",
                  "weather-daily.json"
              ],
              "Update SwitchBot weather data"
          )


          # ============================================================
          # 2) ARCHIVIO PRECISO
          #
          # 5 campioni ogni 2 minuti
          # → un unico slot medio da 10 minuti
          # ============================================================

          for i in range(4):

              time.sleep(120)

              reading = switchbot_status()

              samples.append(reading)

              print(
                  f"ARCHIVIO - campione "
                  f"{i + 2}/5: "
                  f"{reading['temperature']:.1f} °C - "
                  f"{reading['humidity']:.0f}% - "
                  f"{reading['capturedAt'].isoformat()}"
              )


          avg_temp = round(
              sum(
                  x["temperature"]
                  for x in samples
              )
              / len(samples),
              2
          )


          avg_humidity = round(
              sum(
                  x["humidity"]
                  for x in samples
              )
              / len(samples),
              1
          )


          first_local = (
              samples[0]["capturedAt"]
              .astimezone(ROME)
          )


          block_start = first_local.replace(
              minute=(
                  first_local.minute // 10
              ) * 10,

              second=0,
              microsecond=0
          )


          block_end = (
              block_start
              + timedelta(minutes=10)
          )


          archive_date = (
              block_start.strftime("%Y-%m-%d")
          )

          archive_time = (
              block_end.strftime("%H:%M")
          )


          slot = {
              "time":
                  block_end
                  .astimezone(timezone.utc)
                  .isoformat()
                  .replace("+00:00", "Z"),

              "date":
                  archive_date,

              "localTime":
                  archive_time,

              "temperature":
                  avg_temp,

              "humidity":
                  avg_humidity,

              "samples":
                  len(samples),

              "method":
                  "mean_5_samples_2min"
          }


          tenmin = read_json(
              "weather-archive-10min.json",
              []
          )

          if not isinstance(tenmin, list):
              tenmin = []


          tenmin = [
              row
              for row in tenmin
              if not (
                  isinstance(row, dict)
                  and row.get("time")
                  == slot["time"]
              )
          ]


          tenmin.append(slot)


          tenmin.sort(
              key=lambda x:
                  x.get("time", "")
          )


          write_json(
              "weather-archive-10min.json",
              tenmin
          )


          # ============================================================
          # 3) ARCHIVIO GIORNALIERO
          #
          # Dal 01/09:
          #
          # MIN = minimo T normalizzata
          # MAX = massimo T normalizzata
          #
          # UR2 = UR1 + 3
          #
          # La giornata corrente viene esclusa.
          # ============================================================

          now_local = datetime.now(
              timezone.utc
          ).astimezone(ROME)

          today_local_date = (
              now_local.strftime("%Y-%m-%d")
          )


          archive_daily = []


          # Raggruppiamo gli slot per giorno.

          days = {}

          for row in tenmin:

              if not isinstance(row, dict):
                  continue

              date = row.get("date")

              if not date:
                  continue

              if date < ARCHIVE_START_DATE:
                  continue

              if date >= today_local_date:
                  continue

              temperature = row.get(
                  "temperature"
              )

              humidity = row.get(
                  "humidity"
              )

              local_time = row.get(
                  "localTime"
              )

              if (
                  temperature is None
                  or humidity is None
                  or local_time is None
              ):
                  continue

              try:
                  temperature = float(
                      temperature
                  )

                  humidity = float(
                      humidity
                  )

              except Exception:
                  continue


              normalized = (
                  normalize_temperature(
                      temperature,
                      humidity
                  )
              )


              if normalized is None:
                  continue


              days.setdefault(
                  date,
                  []
              ).append(
                  {
                      "temperature":
                          temperature,

                      "humidity":
                          humidity,

                      "normalized":
                          normalized,

                      "localTime":
                          local_time
                  }
              )


          # ============================================================
          # CREAZIONE MIN/MAX GIORNALIERI
          # ============================================================

          for date in sorted(days):

              rows = days[date]

              if not rows:
                  continue


              min_row = min(
                  rows,
                  key=lambda x:
                      x["normalized"]
              )

              max_row = max(
                  rows,
                  key=lambda x:
                      x["normalized"]
              )


              min_value = round(
                  min_row["normalized"],
                  2
              )

              max_value = round(
                  max_row["normalized"],
                  1
              )


              archive_daily.append(
                  {
                      "date": date,

                      "min": min_value,

                      "minTime":
                          min_row["localTime"],

                      "max": max_value,

                      "maxTime":
                          max_row["localTime"],

                      "method":
                          "min_max_10min_normalized_UR_plus_3"
                  }
              )


          write_json(
              "weather-archive-daily.json",
              archive_daily
          )


          print(
              f"ARCHIVIO - slot "
              f"{block_start.strftime('%H:%M')}-"
              f"{block_end.strftime('%H:%M')} => "
              f"{avg_temp:.2f} °C "
              f"UR {avg_humidity:.1f}% "
              f"({len(samples)} campioni)"
          )


          commit_and_push(
              [
                  "weather-archive-10min.json",
                  "weather-archive-daily.json"
              ],
              "Aggiorna archivio preciso - UR +3"
          )

          PY
