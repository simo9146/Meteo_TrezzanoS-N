name: Update Weather Data
permissions:
  contents: write
on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

jobs:
  update-weather:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get SwitchBot sensor data
        env:
          SWITCHBOT_TOKEN: ${{ secrets.SWITCHBOT_TOKEN }}
          SWITCHBOT_SECRET: ${{ secrets.SWITCHBOT_SECRET }}
          DEVICE_ID: E77601C60C32
        run: |
          python3 <<'PY'
          import os
          import time
          import uuid
          import hmac
          import hashlib
          import base64
          import urllib.request
          import json

          token = os.environ["SWITCHBOT_TOKEN"]
          secret = os.environ["SWITCHBOT_SECRET"]
          device_id = os.environ["DEVICE_ID"]

          t = str(int(time.time() * 1000))
          nonce = str(uuid.uuid4())
          data = token + t + nonce

          sign = base64.b64encode(
              hmac.new(
                  secret.encode("utf-8"),
                  data.encode("utf-8"),
                  hashlib.sha256
              ).digest()
          ).decode("utf-8")

          url = f"https://api.switch-bot.com/v1.1/devices/{device_id}/status"

          req = urllib.request.Request(
              url,
              headers={
                  "Authorization": token,
                  "sign": sign,
                  "nonce": nonce,
                  "t": t,
                  "Content-Type": "application/json"
              }
          )

          with urllib.request.urlopen(req) as response:
              result = json.loads(response.read().decode())

          body = result.get("body", {})

          output = {
              "deviceId": device_id,
              "temperature": body.get("temperature"),
              "humidity": body.get("humidity"),
              "battery": body.get("battery"),
              "updatedAt": time.strftime("%Y-%m-%d %H:%M:%S")
          }

          with open("weather-data.json", "w", encoding="utf-8") as f:
              json.dump(output, f, ensure_ascii=False, indent=2)

          print(json.dumps(output, indent=2, ensure_ascii=False))
          PY

      - name: Commit weather data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weather-data.json
          git diff --staged --quiet || git commit -m "Update weather data"

      - name: Push changes
        run: |
          git push
